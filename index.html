<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWA | Fixed Payment Scheme</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;font-family:Arial,Helvetica,sans-serif;color:#111827}.shell{max-width:1020px;margin:28px auto;padding:25px 30px;background:white;border:1px solid #e4e7ec;border-radius:17px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:20px;margin:0 0 8px;font-weight:650}p{margin:0;color:#667085;font-size:14px}.pill{background:#dcf8e7;color:#078548;border-radius:22px;padding:7px 12px;font-size:13px;font-weight:bold}.filters{display:flex;align-items:center;gap:12px;margin-top:27px;flex-wrap:wrap}select{padding:10px 12px;border:1px solid #d5dce6;border-radius:8px;background:white;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:27px 0 38px}.kpi{padding:15px;border-radius:10px;background:#fafbfc}.kpi span{display:block;color:#667085;font-size:13px;margin-bottom:11px}.kpi strong{font-size:29px;font-weight:600}h2{font-size:19px;margin:0 0 20px}.legend{text-align:center;margin:16px}.legend span{margin:0 12px;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px}.note{font-size:12px;color:#8993a4;margin-top:30px}.status{font-size:12px;color:#64748b;margin-left:auto}svg{width:100%;height:auto;display:block}button{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;cursor:pointer;color:#334155}button:hover{background:#f1f5f9}@media(max-width:600px){.shell{margin:8px;padding:17px}.kpis{gap:7px}.kpi{padding:10px}.kpi strong{font-size:22px}.kpi span{font-size:11px}.status{margin-left:0}}
</style>
</head>
<body>
<main class="shell">
<header><div><h1>EWA | Fixed Payment Scheme</h1><p>Campaign Performance</p></div><span class="pill">Campaign Overview</span></header>
<div class="filters"><label for="location">Location</label><select id="location"><option value="">All Locations</option></select><label for="date">Date</label><select id="date"><option value="">All Dates</option></select><button id="refresh">Refresh</button><span class="status" id="status">Connecting to Google Sheets…</span></div>
<section class="kpis"><div class="kpi"><span>Visitors</span><strong id="visitors">—</strong></div><div class="kpi"><span>Enrollments</span><strong id="enrollments">—</strong></div><div class="kpi"><span>Conversion</span><strong id="conversion">—</strong></div></section>
<h2>Visitors vs. Enrollments by Location</h2><svg id="chart" viewBox="0 0 900 440" role="img" aria-label="Visitors and enrollments by location"></svg>
<div class="legend"><span><i class="dot" style="background:#5399f6"></i>Visitors</span><span><i class="dot" style="background:#69c780"></i>Enrollments</span></div>
<p class="note" id="note">Waiting for campaign reporting data.</p>
</main>
<script>
const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzRnPQ6tXfAsuT0fK2vGt12O219L7LRMBldM2_3QsnDCe7USRQl0VohoJOxBDZAwbuoBw/exec';
let records = [];
let hasLoaded = false;
const svg=document.getElementById('chart'),sel=document.getElementById('location'),dateSel=document.getElementById('date'),NS='http://www.w3.org/2000/svg';
function elem(tag,attrs,text){const x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;return x}
function normalizeDate(raw){
 if(raw instanceof Date&&!Number.isNaN(raw.getTime()))return raw.toISOString().slice(0,10);
 const s=String(raw??'').trim();
 if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(m){const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);const dt=new Date(Date.UTC(y,mo-1,d));if(dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
 return '';
}
function displayDate(iso){const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function updateOptions(select,values,allLabel,display=x=>x){
 const old=select.value;
 select.replaceChildren(new Option(allLabel,''));
 values.forEach(value=>select.add(new Option(display(value),value)));
 select.value=values.includes(old)?old:'';
}
function render(){
 if(!hasLoaded)return;
 const rows=records.filter(r=>(!sel.value||r.location===sel.value)&&(!dateSel.value||r.date===dateSel.value));
 const vis=rows.reduce((s,r)=>s+r.visitors,0),enr=rows.reduce((s,r)=>s+r.enrollments,0);
 document.getElementById('visitors').textContent=vis.toLocaleString();
 document.getElementById('enrollments').textContent=enr.toLocaleString();
 document.getElementById('conversion').textContent=(vis?100*enr/vis:0).toFixed(1)+'%';
 const grouped=new Map();
 for(const r of rows){if(!grouped.has(r.location))grouped.set(r.location,{location:r.location,visitors:0,enrollments:0});const item=grouped.get(r.location);item.visitors+=r.visitors;item.enrollments+=r.enrollments;}
 const bars=[...grouped.values()].sort((a,b)=>a.location.localeCompare(b.location));
 svg.replaceChildren();
 const left=55,right=15,top=15,bottom=385,width=900-left-right;
 const max=Math.max(140,Math.ceil(Math.max(0,...bars.map(r=>r.visitors),...bars.map(r=>r.enrollments))/35)*35);
 for(let i=0;i<=4;i++){const v=max*i/4,y=bottom-(bottom-top)*i/4;svg.append(elem('line',{x1:left,y1:y,x2:900-right,y2:y,stroke:'#e5eaf0','stroke-dasharray':'4 4'}),elem('text',{x:left-12,y:y+4,'text-anchor':'end','font-size':12,fill:'#6b7280'},String(Math.round(v))))}
 if(!bars.length){svg.append(elem('text',{x:450,y:205,'text-anchor':'middle',fill:'#667085','font-size':15},'No data for selected filters'));return;}
 bars.forEach((r,i)=>{
  const slot=width/bars.length,center=left+slot*(i+.5),bw=Math.min(120,slot*.32);
  [[r.visitors,'#5399f6','Visitors'],[r.enrollments,'#69c780','Enrollments']].forEach(([v,color,label],j)=>{
   const x=center+(j===0?-bw-3:3),h=v/max*(bottom-top),y=bottom-h;
   const rect=elem('rect',{x,y,width:bw,height:h,rx:10,fill:color});rect.append(elem('title',{},`${r.location}: ${label} ${v}`));
   svg.append(rect,elem('text',{x:x+bw/2,y:y+Math.min(21,Math.max(14,h/2)),'text-anchor':'middle',fill:h>28?'white':'#111827','font-size':14,'font-weight':600},String(v)));
  });
  const label=elem('text',{x:center,y:bottom+27,'text-anchor':'middle',fill:'#667085','font-size':14},r.location);
  if(r.location.length>17)label.setAttribute('font-size','11');
  svg.append(label);
  if(!sel.value){const hit=elem('rect',{x:center-slot/2,y:top,width:slot,height:bottom-top+40,fill:'transparent',tabindex:0,role:'button','aria-label':'Filter '+r.location});hit.style.cursor='pointer';hit.addEventListener('click',()=>{sel.value=r.location;render()});hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel.value=r.location;render()}});svg.append(hit);}
 });
}
let loading=false;
let requestCounter=0;
function getSheetData(){
 return new Promise((resolve,reject)=>{
  const callback='ewaSheetCallback_'+Date.now()+'_'+(++requestCounter);
  const script=document.createElement('script');
  let finished=false;
  const timer=setTimeout(()=>finish(new Error('Connection timed out after 15 seconds')),15000);
  function finish(error,data){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];script.remove();if(error)reject(error);else resolve(data)}
  window[callback]=data=>finish(null,data);
  script.onerror=()=>finish(new Error('Unable to load Apps Script endpoint. Check deployment access.'));
  script.src=GOOGLE_SHEETS_API_URL+'?callback='+encodeURIComponent(callback)+'&t='+Date.now();
  document.head.appendChild(script);
 });
}
async function load(){
 if(loading)return;
 loading=true;
 const status=document.getElementById('status');status.textContent='Updating…';
 try{
  const json=await getSheetData();
  if(json.success!==true||!Array.isArray(json.records))throw Error(json.error||'Invalid Google Sheets response');
  const valid=[];
  for(const r of json.records){
   const location=String(r.location||r.mall||'').trim(),date=normalizeDate(r.date);
   const visitors=Number(r.visitors),enrollments=Number(r.enrollments);
   if(!location||!date||!Number.isFinite(visitors)||!Number.isFinite(enrollments)||visitors<0||enrollments<0||enrollments>visitors)continue;
   valid.push({location,date,visitors,enrollments});
  }
  records=valid;hasLoaded=true;
  updateOptions(sel,[...new Set(records.map(r=>r.location))].sort((a,b)=>a.localeCompare(b)),'All Locations');
  updateOptions(dateSel,[...new Set(records.map(r=>r.date))].sort((a,b)=>b.localeCompare(a)),'All Dates',displayDate);
  status.textContent='Connected to Google Sheets';
  document.getElementById('note').textContent='Figures are calculated from the connected campaign reporting sheet.';
  render();
 }catch(e){
  status.textContent='Connection failed — '+(hasLoaded?'showing last available figures':'no live data');
  document.getElementById('note').textContent=hasLoaded?'Previously retrieved figures are shown. Refresh to try again.':'Unable to retrieve live data: '+e.message;
  console.error('Google Sheets connection failed:',e);
 }finally{loading=false}
}
sel.addEventListener('change',render);
dateSel.addEventListener('change',render);
document.getElementById('refresh').addEventListener('click',load);
load();setInterval(load,60000);
</script>
</body>
</html>
